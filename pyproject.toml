[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cacheeconomics"
description = "Prompt-cache cost analysis: a dated provider registry, a cost model that separates the four token classes, and an analyzer that turns a trace into a report you can forward."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tanisha Katara", email = "tanisha.bk@gmail.com" }]
keywords = ["prompt-caching", "llm", "cost", "anthropic", "finops", "litellm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
# Deliberately empty, and a feature rather than an omission. The analysis runs
# over prompt structure and usage counters, both of which the standard library
# handles, and a diagnostic that a client has to vet a dependency tree for is a
# diagnostic that does not get run. `python3 -m pytest` needs nothing installed.
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
# The runtime plugin reaches for LiteLLM's CustomLogger when it is present and
# falls back to a plain object when it is not, so this only matters if you are
# mounting the plugin in a proxy.
litellm = ["litellm>=1.0"]

[project.scripts]
cacheeconomics = "cacheeconomics.cli:main"

[project.urls]
Homepage = "https://github.com/Tanisha-Katara/cacheeconomics"
Source = "https://github.com/Tanisha-Katara/cacheeconomics"
Issues = "https://github.com/Tanisha-Katara/cacheeconomics/issues"
Changelog = "https://github.com/Tanisha-Katara/cacheeconomics/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
# One source of truth. A version in both this file and `__init__.py` drifts, and
# the one people read is not the one that ships.
version = { attr = "cacheeconomics.__version__" }

[tool.setuptools]
package-dir = { "" = "harness" }

[tool.setuptools.packages.find]
where = ["harness"]
include = ["cacheeconomics*"]

[tool.setuptools.package-data]
# The registry is the point of the package, not an optional asset: without these
# the cost model cannot price anything and `min_cacheable_tokens` refuses to
# guess. They live inside the package for exactly this reason -- as a sibling
# directory they were invisible to the wheel, and an installed copy raised
# "registry file missing" on first use.
cacheeconomics = ["data/*.json"]
